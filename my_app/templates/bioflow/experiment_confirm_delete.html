{% extends "bioflow/base.html" %}

{% block content %}
  <h1>Delete Experiment</h1>
  
  <p>Are you sure you want to permanently delete the experiment <strong>"{{ experiment.title }}"</strong>?</p>

  <form method="POST">
    {% csrf_token %}
    <button type="submit" style="background-color: #dc3545; color: white; border: none; padding: 5px 10px; cursor: pointer;">
      Confirm Delete
    </button>
    <a href="{% url 'experiment_detail' experiment.pk %}" style="margin-left: 10px;">Cancel</a>
  </form>
{% endblock %}
