{% extends "bioflow/base.html" %}
{% block content %}
  <h1>BioFlow Dashboard</h1>
  <p>Welcome to the laboratory data portal.</p>
  <a href="{% url 'project_index' %}">Enter Project Directory &rarr;</a>

  <section>
  <form action="{% url 'login' %}" method="post" class="login">
    <h1>Login</h1>
    {% csrf_token %} {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}" />
    <button type="submit" class="btn submit">Login</button>
  </form>
</section>

{% endblock %}
