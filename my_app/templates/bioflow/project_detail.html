{% extends "bioflow/base.html" %}

{% block content %}
  <h1>{{ project.name }}</h1>
  
  <p><strong>Status:</strong> {{ project.status }}</p>
  <p><strong>Description:</strong></p>
  <p>{{ project.description }}</p>

  <hr>
  <a href="{% url 'project_update' project.pk %}">Edit Project</a> | 
  <a href="{% url 'project_delete' project.pk %}">Delete Project</a> | 
  <a href="{% url 'project_index' %}">Back to All Projects</a>
{% endblock %}
